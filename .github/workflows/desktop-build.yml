name: Windows Desktop Build

on:
  push:
    branches: [ master, feature/windows-desktop-launcher ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    name: Build and smoke-test Windows desktop app
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install root dependencies
        run: npm install

      - name: Install client dependencies
        run: npm --prefix client install

      - name: Validate setup scripts
        shell: pwsh
        run: |
          node --check scripts/runtime-manager.cjs
          node --check scripts/setup.mjs
          node --check scripts/sync-extensions.mjs
          node --check scripts/install-extensions.mjs

      - name: Test idempotent Windows setup command
        shell: pwsh
        run: ./scripts/setup.ps1 -SkipRuntime -SkipBuild

      - name: Install and integration-test the Suwayomi extension runtime
        run: node scripts/runtime-smoke.mjs

      - name: Run desktop backend lifecycle smoke test
        run: npm run desktop:smoke
        env:
          OMNIYOMI_SKIP_RUNTIME_SETUP: '1'

      - name: Build NSIS installer and portable executable
        run: npm run desktop:dist

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: OmniYomi-Desktop-Windows-x64
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30
