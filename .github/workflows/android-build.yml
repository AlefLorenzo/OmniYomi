name: Android Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão do APK (ex: 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Aceitar licenças do Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Configurar local.properties para Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > client/android/local.properties

      - name: Determinar versão
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Instalar dependências raiz
        run: npm install

      - name: Instalar dependências client
        run: cd client && npm install

      - name: Build do cliente React SPA
        run: cd client && npm run build
        env:
          npm_package_version: ${{ steps.get_version.outputs.VERSION }}

      - name: Configurar permissões e pastas do Android
        run: |
          chmod +x client/android/gradlew
          mkdir -p client/android/app/src/main/assets/public

      - name: Sincronizar Capacitor Android
        run: |
          cd client
          npx cap sync android || npx cap copy android

      - name: Configurar versionamento no build.gradle
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          VERSION_CODE=$(echo $VERSION | tr -d '.' | sed 's/^0*//')
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE=1; fi
          GRADLE_FILE="client/android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/" "$GRADLE_FILE"
            sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" "$GRADLE_FILE"
          fi

      # Verifica se a keystore foi configurada como secret e grava o resultado
      - name: Verificar configuração de Keystore
        id: keystore_check
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            mkdir -p client/android/app/keystore
            echo "$KEYSTORE_B64" | base64 -d > client/android/app/keystore/omniyomi.keystore
            echo "Keystore configurada com sucesso."
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "Nenhuma keystore fornecida — apenas APK debug será gerado."
          fi
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Compilar APK Debug
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Compilar APK Release (somente se keystore configurada)
        if: steps.keystore_check.outputs.configured == 'true'
        run: |
          cd client/android
          ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: app/keystore/omniyomi.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Localizar e renomear APKs
        id: find_apk
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"

          DEBUG_APK=$(find client/android/app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "OmniYomi-v${VERSION}.apk"
            echo "DEBUG_OUTPUT=OmniYomi-v${VERSION}.apk" >> $GITHUB_OUTPUT
            echo "APK Gerado: OmniYomi-v${VERSION}.apk"
          fi

          RELEASE_APK=$(find client/android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "OmniYomi-v${VERSION}-release.apk"
            echo "RELEASE_OUTPUT=OmniYomi-v${VERSION}-release.apk" >> $GITHUB_OUTPUT
            echo "APK Release: OmniYomi-v${VERSION}-release.apk"
          fi

      - name: Upload APK Debug como artefato
        uses: actions/upload-artifact@v4
        with:
          name: OmniYomi-v${{ steps.get_version.outputs.VERSION }}
          path: OmniYomi-v*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar Release no GitHub
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: OmniYomi v${{ steps.get_version.outputs.VERSION }}
          tag_name: ${{ github.ref_name || format('v{0}', steps.get_version.outputs.VERSION) }}
          body: |
            ## 📱 OmniYomi v${{ steps.get_version.outputs.VERSION }} — Android APK

            Versão oficial do leitor e gerenciador de mangás, manhwas e manhuas OmniYomi para Android.
            **100% Standalone (sem necessidade de servidor local)**.

            ### 📥 Como instalar
            1. Baixe o arquivo `OmniYomi-v${{ steps.get_version.outputs.VERSION }}.apk` abaixo.
            2. Abra o arquivo no seu celular Android.
            3. Se solicitado, permita a instalação de fontes desconhecidas.

            ### ✨ Recursos desta versão
            - 🌐 1.600+ extensões do ecossistema Tachiyomi / Keiyoushi
            - ⚡ 100% Standalone: funciona direto no celular sem computador ligado
            - 📖 Leitura online e offline fluida
            - 📱 Interface responsiva com navegação inferior mobile (BottomNav)
            - ❤️ Biblioteca, histórico e favoritos locais
            - 🔄 Verificador e instalador de atualizações integrado via GitHub
          files: |
            OmniYomi-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
