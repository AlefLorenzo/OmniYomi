name: Android Build & Release

on:
  push:
    tags:
      - 'android-v*'
  pull_request:
    branches: [ master ]
    paths:
      - 'client/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão do APK (ex: 1.1.6)'
        required: true
        default: '1.1.6'
      publish_release:
        description: 'Publicar o APK como release Android (em vez de apenas gerar artefato)'
        required: false
        type: boolean
        default: false

concurrency:
  group: omniyomi-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repositório
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Aceitar licenças do Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Configurar local.properties para Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > client/android/local.properties

      - name: Determinar versão
        id: get_version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/android-v}"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(node -p "require('./client/package.json').version")"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão inválida: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Instalar dependências raiz
        run: npm install

      - name: Instalar dependências client
        run: npm --prefix client install

      - name: Build do cliente React SPA
        run: npm --prefix client run build
        env:
          OMNIYOMI_APP_VERSION: ${{ steps.get_version.outputs.VERSION }}

      - name: Configurar permissões e pastas do Android
        run: |
          chmod +x client/android/gradlew
          mkdir -p client/android/app/src/main/assets/public
          cp -r client/dist/* client/android/app/src/main/assets/public/
          cp client/capacitor.config.json client/android/app/src/main/assets/capacitor.config.json

      - name: Sincronizar assets do Capacitor Android
        run: cd client && npx cap sync android

      - name: Configurar versionamento no build.gradle
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          VERSION_CODE=$(echo "$VERSION" | awk -F. '{ printf "%d%03d%03d", $1, $2, $3 }')
          GRADLE_FILE="client/android/app/build.gradle"
          if [[ ! -f "$GRADLE_FILE" ]]; then
            echo "Arquivo Gradle não encontrado: $GRADLE_FILE"
            exit 1
          fi
          sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/" "$GRADLE_FILE"
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" "$GRADLE_FILE"

      - name: Verificar configuração de Keystore
        id: keystore_check
        shell: bash
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            mkdir -p client/android/app/keystore
            echo "$KEYSTORE_B64" | base64 -d > client/android/app/keystore/omniyomi.keystore
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma keystore fornecida — apenas APK debug será gerado."
          fi
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Compilar APK Debug
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Exigir assinatura estável para publicar uma atualização
        if: startsWith(github.ref, 'refs/tags/android-v') || inputs.publish_release
        shell: bash
        run: |
          if [[ "${{ steps.keystore_check.outputs.configured }}" != "true" ]]; then
            echo "::error::Publicação Android bloqueada: configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS e KEY_PASSWORD para gerar APK assinada com chave estável."
            exit 1
          fi

      - name: Compilar APK Release (somente se keystore configurada)
        if: steps.keystore_check.outputs.configured == 'true'
        run: |
          cd client/android
          ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: app/keystore/omniyomi.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Localizar e renomear APKs
        id: find_apk
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          DEBUG_APK=$(find client/android/app/build/outputs/apk/debug -name "*.apk" -print -quit)
          if [[ -z "$DEBUG_APK" || ! -f "$DEBUG_APK" ]]; then
            echo "APK debug não foi gerado."
            exit 1
          fi
          cp "$DEBUG_APK" "OmniYomi-v${VERSION}.apk"

          RELEASE_APK=$(find client/android/app/build/outputs/apk/release -name "*.apk" -print -quit 2>/dev/null || true)
          if [[ -n "$RELEASE_APK" && -f "$RELEASE_APK" ]]; then
            cp "$RELEASE_APK" "OmniYomi-v${VERSION}-release.apk"
          fi

      - name: Upload APKs como artefato
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OmniYomi-Android-v${{ steps.get_version.outputs.VERSION }}
          path: OmniYomi-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release Android
        if: startsWith(github.ref, 'refs/tags/android-v') || inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          TAG="android-v${VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            TAG="$GITHUB_REF_NAME"
          fi

          SIGNED_APK="OmniYomi-v${VERSION}-release.apk"
          if [[ ! -f "$SIGNED_APK" ]]; then
            echo "::error::APK release assinada não foi gerada; recusando publicar APK debug como atualização."
            exit 1
          fi

          NOTES="OmniYomi Android v${VERSION}. APK assinada para atualização sobre instalações existentes."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$SIGNED_APK" --clobber
            gh release edit "$TAG" --title "OmniYomi Android v${VERSION}" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" "$SIGNED_APK" --title "OmniYomi Android v${VERSION}" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
