name: CI - Build & Test

on:
  push:
    branches: [ master, main, fix/android-extensions-runtime-v1.1.7 ]
  pull_request:
    branches: [ master, main, fix/android-extensions-runtime-v1.1.6, fix/android-extensions-runtime-v1.1.7 ]

jobs:
  validate:
    name: Build & TypeScript Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências raiz
        run: npm install

      - name: Instalar dependências client
        run: cd client && npm install

      - name: Verificar compilação TypeScript (Server)
        run: npx tsc --noEmit

      - name: Compilar Cliente Vite SPA
        run: cd client && npm run build
