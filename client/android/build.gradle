// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { project ->
        int javaMajor = 17
        try {
            javaMajor = Integer.parseInt(JavaVersion.current().getMajorVersion())
        } catch (Exception ignored) {}

        if (project.hasProperty("android")) {
            project.android {
                compileOptions {
                    sourceCompatibility javaMajor >= 21 ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17
                    targetCompatibility javaMajor >= 21 ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17
                }
            }
        }
        if (project.plugins.hasPlugin("kotlin-android")) {
            try {
                project.kotlin {
                    jvmToolchain(javaMajor >= 21 ? 21 : 17)
                }
            } catch (Exception ignored) {}
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
